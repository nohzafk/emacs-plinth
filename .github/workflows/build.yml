name: MacOS Build for GNU Emacs

# Every push and pull request runs the tests. A release is built only when
# dispatched by hand, and only after the tests pass on the same commit.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Offline tests
        run: |
          # BASH_ENV would be sourced by every bash the tests start.
          for t in tests/test_*.py; do
            env -u BASH_ENV python3 "$t"
          done
      - name: Fetch the pinned source
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          emacs_prepare_source "$RUNNER_TEMP/$EMACS_SOURCE_DIR"
          # The files the patches touch, from the pinned commit itself.
          mkdir "$RUNNER_TEMP/ui-targets"
          git -C "$RUNNER_TEMP/$EMACS_SOURCE_DIR" archive HEAD src lisp/term \
            | tar -x -C "$RUNNER_TEMP/ui-targets"
      - name: Apply the patch set to the pinned source
        run: |
          # The integration tests skip unless this directory exists; check it
          # so a missing tree fails here instead of passing as a skip.
          test -f "$RUNNER_TEMP/ui-targets/src/nsterm.m"
          EBUILD_UI_TARGETS="$RUNNER_TEMP/ui-targets" env -u BASH_ENV \
            python3 tests/test_ui_patches.py
  build:
    needs: tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: write
    # Two dispatches of one build number would both pass the tag check below;
    # running them one at a time makes the second one refuse.
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        # Fail fast: -e halts on any error, -u catches unset vars,
        # -o pipefail propagates errors through pipes, -x echoes commands.
        # Without this, curl/tar failures silently cascade into confusing
        # `patch: File to patch:` prompts several steps later.
        shell: bash -euxo pipefail {0}
    env:
      # --fail: non-zero on HTTP 4xx/5xx (otherwise mirror error pages
      #   silently land as 166-byte "tarballs").
      # --retry 5 --retry-delay 5: paper over flaky GNU ftp mirrors.
      CURL_OPTS: "--fail --retry 5 --retry-delay 5 --location"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load Emacs source lock
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          printf '%s\n' "EMACS_SOURCE_LABEL=$EMACS_SOURCE_LABEL" \
            "EMACS_SOURCE_DIR=$EMACS_SOURCE_DIR" "EMACS_ARTIFACT=$EMACS_ARTIFACT" \
            "EMACS_RELEASE_TAG=$EMACS_RELEASE_TAG" \
            "EMACS_RELEASE_NAME=$EMACS_RELEASE_NAME" >> "$GITHUB_ENV"
      - name: Refuse an existing release tag
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          emacs_check_release_tag_free "$GITHUB_WORKSPACE"
      - name: Uninstall Homebrew
        run: |
          curl $CURL_OPTS -O https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh
          sudo chmod +x uninstall.sh
          sudo env NONINTERACTIVE=1 ./uninstall.sh
          sudo rm -rf /opt/homebrew
          export PATH=''
          eval $(/usr/libexec/path_helper -s)
      - name: Install GNU M4
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep m4
          ./configure && make -j4
          sudo make install
      - name: Install GNU Autoconf
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep autoconf
          ./configure && make -j4
          sudo make install
      - name: Install GNU Automake
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep automake
          ./configure && make -j4
          sudo make install
      - name: Install GNU Libtool
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep libtool
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Pkgconf
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep pkgconf
          ./autogen.sh && ./configure --disable-shared && make -j4
          sudo make install
          sudo ln -s /usr/local/bin/pkgconf /usr/local/bin/pkg-config
      - name: Install GNU Texinfo
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep texinfo
          ./configure && make -j4
          sudo make install
      - name: Install GNU Libiconv
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep libiconv
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Libunistring
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep libunistring
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Gettext
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep gettext
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Ncurses
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep ncurses
          ./configure --disable-shared \
                     --with-terminfo-dirs=/usr/share/terminfo:/usr/local/share/terminfo \
            && make -j4
          sudo make install
          sudo ln -s /usr/local/include/ncursesw/curses.h /usr/local/include/ncurses.h
      - name: Install Zlib
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep zlib
          ./configure --static && make -j4
          sudo make install
      - name: Install Libwebp
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep libwebp
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libxml2
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep libxml2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Libgmp
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep gmp
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libnettle
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep nettle
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libidn2
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep libidn2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GnuTLS
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep gnutls
          ./configure --disable-shared --with-included-libtasn1 --without-p11-kit && make -j4
          sudo make install
      - name: Install Libtreesitter
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep treesitter
          make -j4
          sudo make install
          sudo find /usr/local/lib -name 'libtree-sitter*.dylib' -delete
      - name: Install GNU Gzip
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-ci-deps.sh"
          emacs_ci_prepare_dep gzip
          ./configure && make -j4
          sudo make install
      - name: Build Emacs
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-patches.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-configure.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-sign.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-deps.sh"
          emacs_prepare_source "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          cd "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          # Fixed, vendored emacs-plus/local UI patch set.  Same ordered,
          # SHA-256-verified, strict -F0 application as scripts/build.sh; no
          # patch is downloaded and no wildcard/app cache is consulted.
          emacs_apply_patches "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          sed -i '' '/darwin/ s/-lncurses"/-lncursesw"/' configure.ac
          ./autogen.sh && emacs_configure
          make -j4
          make install
          ditto nextstep/Emacs.app Emacs.app
          emacs_mark_output Emacs.app
          emacs_mark_patches Emacs.app
          emacs_mark_configuration Emacs.app
          emacs_deps_digest > Emacs.app/Contents/Resources/ebuild-deps.txt
          emacs_sign_bundle Emacs.app
          tar -Jcf "$EMACS_ARTIFACT" Emacs.app
          shasum -a 256 "$EMACS_ARTIFACT" > "$EMACS_ARTIFACT.sha256"
      - name: Write release notes
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-patches.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-deps.sh"
          cd "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          # The notes describe the bundle being published: its markers must
          # be the ones this commit's locks produce.
          resources=Emacs.app/Contents/Resources
          test "$(cat "$resources/ebuild-source.txt")" = "$(emacs_source_metadata)"
          test "$(cat "$resources/ebuild-patches.txt")" = "$(emacs_patches_metadata)"
          deps_digest="$(emacs_deps_digest)"
          if ! printf '%s\n' "$deps_digest" | cmp -s "$resources/ebuild-deps.txt" -; then
            echo "Missing or mismatched dependency lock marker: $resources/ebuild-deps.txt" >&2
            exit 1
          fi
          {
            printf '%s for macOS on Apple silicon: build %s of emacs-plinth.\n\n' \
              "$EMACS_SOURCE_RELEASE_NAME" "$EMACS_BUILD_NUMBER"
            printf -- '- Source: %s at `%s`, the commit the upstream tag `%s` points at.\n' \
              "$EMACS_SOURCE_REPOSITORY" "$EMACS_SOURCE_REVISION" "$EMACS_SOURCE_RELEASE_TAG"
            printf -- '- Patch set: `patchset=%s`, as recorded in `Contents/Resources/ebuild-patches.txt` inside the bundle. Applied in this order:\n' \
              "$(emacs_patches_digest)"
            emacs_patch_entries | while IFS=$'\t' read -r _ path; do
              printf '  - `%s`\n' "$path"
            done
            printf -- '- Dependency lock SHA-256: `%s`, as recorded in `Contents/Resources/ebuild-deps.txt` inside the bundle.\n' "$deps_digest"
            printf -- '- No font is bundled. bendmacs installs RysMono from https://github.com/nohzafk/rysmono.\n'
            printf -- '- Verify the download: `shasum -a 256 -c %s.sha256`.\n' "$EMACS_ARTIFACT"
          } > release-notes.md
          cat release-notes.md
      - name: Recheck the release tag
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          emacs_check_release_tag_free "$GITHUB_WORKSPACE"
      - name: Release Emacs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EMACS_RELEASE_TAG }}
          # The action creates the tag at the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ${{ env.EMACS_RELEASE_NAME }}
          body_path: ${{ env.EMACS_SOURCE_DIR }}/release-notes.md
          files: |
            ${{ env.EMACS_SOURCE_DIR }}/${{ env.EMACS_ARTIFACT }}
            ${{ env.EMACS_SOURCE_DIR }}/${{ env.EMACS_ARTIFACT }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
